<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Recover account — Legacy</title><link rel="stylesheet" href="assets/css/styles.css" /><script type="module" src="assets/js/app.js"></script></head>
  <body><a class="skip-link" href="#main">Skip to main content</a><header class="site-header"><div class="wrap"><a class="site-title" href="index.html">Legacy</a></div></header>
    <main id="main" class="wrap narrow"><h1>Recover your account</h1><p>A reset email can be sent only when this installation has configured email delivery.</p>
      <form data-auth-form data-endpoint="/api/auth/request-reset"><label for="email">Account email</label><input id="email" name="email" type="email" autocomplete="email" required /><button class="button" type="submit">Request reset link</button></form>
      <p tabindex="-1" role="alert" data-message></p></main>
  </body>
</html>
