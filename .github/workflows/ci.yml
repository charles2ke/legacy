name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate profiles and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate profiles
        run: npm run validate
      - name: Check CODEOWNERS matches the profiles
        run: npm run codeowners:check
      - name: Run tests
        run: npm test
