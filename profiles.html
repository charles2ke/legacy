<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profiles — Legacy</title>
    <meta name="description" content="Browse the legacy profiles contributed to this archive." />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script type="module" src="assets/js/site.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header">
      <div class="wrap">
        <a class="site-title" href="index.html">Legacy</a>
        <nav class="site-nav" aria-label="Main">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="profiles.html" aria-current="page">Profiles</a></li>
            <li><a href="contribute.html">Contribute</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main" class="wrap">
      <h1>Profiles</h1>
      <p class="lede">
        Only moderator-approved profiles appear here. Identity is not independently
        verified.
      </p>
      <form class="filters" method="get" action="profiles.html" role="search">
        <label for="q">Search approved profiles</label>
        <input id="q" name="q" type="search" maxlength="100" />
        <label for="fictional">Profile type</label>
        <select id="fictional" name="fictional">
          <option value="">All profiles</option>
          <option value="false">Non-fictional</option>
          <option value="true">Fictional examples</option>
        </select>
        <label><input type="checkbox" name="hasWork" value="true" /> Includes work</label>
        <button class="button" type="submit">Search</button>
      </form>
      <div data-profile-list aria-live="polite">
        <noscript>
          <p class="status">
            JavaScript is required to load the moderated public directory.
          </p>
        </noscript>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>
          Want to add a profile? Read the
          <a href="contribute.html">contribution instructions</a>.
        </p>
        <p data-removal-contact>Loading removal contact…</p>
      </div>
    </footer>
  </body>
</html>
