<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create account — Legacy</title><link rel="stylesheet" href="assets/css/styles.css" />
    <script type="module" src="assets/js/app.js"></script>
  </head>
  <body><a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header"><div class="wrap"><a class="site-title" href="index.html">Legacy</a><nav class="site-nav" aria-label="Main"><ul><li><a href="profiles.html">Profiles</a></li><li><a href="login.html">Sign in</a></li></ul></nav></div></header>
    <main id="main" class="wrap narrow"><h1>Create an account</h1><p>Your email is used only for authentication and recovery. It is never included in a public profile.</p>
      <form data-auth-form data-endpoint="/api/auth/signup">
        <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required />
        <label for="password">Password (at least 12 characters)</label><input id="password" name="password" type="password" minlength="12" maxlength="200" autocomplete="new-password" required />
        <button class="button" type="submit">Create account</button>
      </form><p tabindex="-1" role="alert" data-message></p>
    </main>
  </body>
</html>
